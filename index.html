<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Прайс-лист IT-администрирование</title>
<style>
:root{
  --desk:#EDEFF2;--paper:#FFFFFF;--ink:#1A1D21;--mut:#5B6470;--faint:#8A93A0;
  --line:#D8DCE1;--line-soft:#E3E7EC;--navy:#1F4E79;--navy-d:#173B5C;
  --head:#EDF2F7;--green:#1E7A46;--rust:#B3402A;--note-bg:#F5F7FA;--note-ink:#3E4A5C;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--desk);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:var(--desk)}
::-webkit-scrollbar-thumb{background:#C4CBD4;border-radius:6px;border:2px solid var(--desk)}
::-webkit-scrollbar-thumb:hover{background:var(--navy)}
*{scrollbar-width:thin;scrollbar-color:#C4CBD4 #EDEFF2}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
b{font-weight:600}
.toolbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-inner{max-width:880px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tb-doc{font-size:13px;color:var(--mut)}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;font-size:13px;font-weight:600;border-radius:6px;border:1px solid var(--navy);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.btn-pri{background:var(--navy);color:#fff}
.btn-pri:hover{background:var(--navy-d)}
.btn-sec{background:#fff;color:var(--navy)}
.btn-sec:hover{background:var(--head)}
.btn[disabled]{opacity:.7;cursor:default}
.sheet{max-width:880px;margin:26px auto 72px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(16,24,40,.08),0 10px 28px rgba(16,24,40,.06);padding:44px 52px}
section{scroll-margin-top:72px}
.head{border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:18px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.subtitle{color:var(--mut);font-size:14px;margin-top:5px}
.head .meta{margin-top:8px}
.toc{background:var(--note-bg);border:1px solid var(--line-soft);border-radius:4px;padding:11px 15px;font-size:13px;color:var(--mut);margin-bottom:6px}
.toc b{color:var(--ink);margin-right:6px}
.toc a{text-decoration:none;border-bottom:1px solid #C9D4E0;margin:0 2px;white-space:nowrap}
.toc a:hover{border-bottom-color:var(--navy)}
h2{font-size:17.5px;font-weight:700;color:var(--navy);margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lead{color:var(--mut);font-size:14px;margin-bottom:12px}
p{margin-bottom:10px}
.meta{color:var(--mut);font-size:12.5px}
.tbl-wrap{overflow-x:auto;margin:10px 0}
table.grid{width:100%;border-collapse:collapse;border:1px solid var(--line);font-size:14px}
.grid th{background:var(--head);color:var(--navy);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:9px 12px;border-bottom:2px solid var(--navy)}
.grid td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.grid tbody tr:last-child td{border-bottom:none}
@media (hover:hover){.grid tbody tr:hover{background:#F5F8FB}}
.desc{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin-top:3px}
.c-num{width:34px;color:var(--faint);font-size:13px}
.c-price{width:132px;text-align:right;white-space:nowrap}
.c-price b{font-size:15px;display:block}
.c-price small{display:block;color:var(--faint);font-size:11.5px;font-weight:400;margin-top:2px;white-space:normal}
.c-val{width:120px;text-align:right;white-space:nowrap;font-weight:700;font-size:15px}
.g{color:var(--green)}.r{color:var(--rust)}
.kv td:first-child{width:190px}
.n{text-align:right;white-space:nowrap}
.calc{min-width:520px}
.sub td{border-top:1.5px solid var(--navy);font-weight:600}
.total td{background:var(--head);border-top:2px solid var(--navy);font-weight:700;font-size:15px}
.note{background:var(--note-bg);border-left:3px solid var(--navy);color:var(--note-ink);font-size:13px;padding:10px 13px;margin:12px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){
  .sheet{margin:0;border-left:none;border-right:none;border-radius:0;padding:24px 18px}
  h1{font-size:20px}.two{grid-template-columns:1fr}
  .btn{padding:7px 11px;font-size:12.5px}.kv td:first-child{width:120px}
}
@media (max-width:480px){.c-num{display:none}.c-price{width:106px}.c-val{width:92px}.grid td,.grid th{padding:8px 9px}}
@media print{
  @page{size:A4;margin:16mm 14mm}
  body{background:#fff;font-size:12px}
  .toolbar{display:none}
  .sheet{max-width:none;margin:0;padding:0;border:none;border-radius:0;box-shadow:none}
  .tbl-wrap{overflow:visible}
  table.grid{font-size:11px}.desc{font-size:10px}.grid th{font-size:9.5px}
  h1{font-size:18px}h2{font-size:14px;margin:18px 0 8px;page-break-after:avoid}
  tr,.note{page-break-inside:avoid}
  thead{display:table-header-group}
  a{color:inherit;text-decoration:none}.toc a{border-bottom:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cellHTML(c){

  if(c.v&&c.u)return{html:'<b>'+esc(c.v)+'</b><small>'+esc(c.u)+'</small>',cls:'c-price'};

    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);

  eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
